[project]
name = "docs-qa"
version = "0.1.0"
description = "A free-to-run Docs/Support Q&A assistant (RAG) with hybrid retrieval, reranking, citations, incremental re-indexing, and an evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Moonshot" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "typer>=0.12",
    "httpx>=0.27",
    "fastembed>=0.3.6",
    "tiktoken>=0.7",
    "pymupdf>=1.24",
    "selectolax>=0.3.21",
    "markdown-it-py>=3.0",
    "numpy>=1.26",
    "redis>=5.0",
    "google-genai>=0.3",
    "groq>=0.11",
]

[project.scripts]
docsqa = "docsqa.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docsqa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
ignore = ["B008"]  # FastAPI dependency-injection default args

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: tests that require an external Postgres+pgvector (DOCSQA_TEST_POSTGRES__DSN)",
]
